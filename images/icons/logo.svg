<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 60" fill="none">
  <!-- House icon -->
  <g transform="translate(0, 4)">
    <!-- Roof -->
    <polygon points="26,4 48,20 4,20" fill="#FAC748"/>
    <!-- House body -->
    <rect x="9" y="20" width="34" height="26" rx="2" fill="#0D3B66"/>
    <!-- Door -->
    <rect x="19" y="30" width="14" height="16" rx="2" fill="#FAC748"/>
    <!-- Door knob -->
    <circle cx="30" cy="38" r="1.5" fill="#0D3B66"/>
    <!-- Chimney -->
    <rect x="34" y="10" width="6" height="10" rx="1" fill="#0D3B66"/>
  </g>
  <!-- Text: Ana Hilda -->
  <text x="58" y="26" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="700" fill="#0D3B66" letter-spacing="0.5">Ana Hilda</text>
  <!-- Text: IMÓVEIS -->
  <text x="58" y="46" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#FAC748" letter-spacing="3">IMÓVEIS</text>
  <!-- Accent line -->
  <rect x="58" y="50" width="120" height="2" rx="1" fill="#FAC748" opacity="0.6"/>
</svg>
